[package]
name = "localid-oauth-client-repository-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
localid-config = { path = "../localid-config" }
localid-oauth-client = { path = "../localid-oauth-client" }
localid-client = { path = "../localid-client" }

serde = { version = "1", features = ["derive"] }

serde_json = "1"

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"] }
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
serial_test = "3"
